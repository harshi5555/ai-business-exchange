[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

; ── Gateway (public entry point — all /api/* traffic) ────────────────────────
[program:gateway]
command=node /app/apps/gateway/dist/index.js
environment=PORT="3000",NODE_ENV="production",
    AUTH_SERVICE_URL="http://127.0.0.1:3001",
    PARTNER_SERVICE_URL="http://127.0.0.1:3002",
    SUBSCRIPTION_SERVICE_URL="http://127.0.0.1:3003",
    INTEGRATION_SERVICE_URL="http://127.0.0.1:3004",
    MAPPING_ENGINE_URL="http://127.0.0.1:3005",
    AGENT_ORCHESTRATOR_URL="http://127.0.0.1:3006",
    BILLING_SERVICE_URL="http://127.0.0.1:3007",
    EXCHANGE_AGENT_URL="http://127.0.0.1:3008"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Auth service ─────────────────────────────────────────────────────────────
[program:auth-service]
command=node /app/apps/auth-service/dist/index.js
environment=PORT="3001",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Partner service ───────────────────────────────────────────────────────────
[program:partner-service]
command=node /app/apps/partner-service/dist/index.js
environment=PORT="3002",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Subscription service ─────────────────────────────────────────────────────
[program:subscription-service]
command=node /app/apps/subscription-service/dist/index.js
environment=PORT="3003",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Integration service ───────────────────────────────────────────────────────
[program:integration-service]
command=node /app/apps/integration-service/dist/index.js
environment=PORT="3004",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Mapping engine ────────────────────────────────────────────────────────────
[program:mapping-engine]
command=node /app/apps/mapping-engine/dist/index.js
environment=PORT="3005",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Agent orchestrator ────────────────────────────────────────────────────────
[program:agent-orchestrator]
command=node /app/apps/agent-orchestrator/dist/index.js
environment=PORT="3006",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Billing service ───────────────────────────────────────────────────────────
[program:billing-service]
command=node /app/apps/billing-service/dist/index.js
environment=PORT="3007",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Exchange Agent (A2A / MCP) ────────────────────────────────────────────────
[program:exchange-agent]
command=node /app/apps/exchange-agent/dist/index.js
environment=PORT="3008",NODE_ENV="production",
    PARTNER_SERVICE_URL="http://127.0.0.1:3002",
    MAPPING_ENGINE_URL="http://127.0.0.1:3005",
    SUBSCRIPTION_SERVICE_URL="http://127.0.0.1:3003",
    INTEGRATION_SERVICE_URL="http://127.0.0.1:3004"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Next.js partner portal ───────────────────────────────────────────────────
[program:partner-portal]
command=/app/node_modules/.bin/next start -p 3100
directory=/app/apps/partner-portal
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=1
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

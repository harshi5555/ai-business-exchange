# nginx — single-host reverse proxy
# Listens on 8080 (Fly.io public HTTP port)
# /api/*          → gateway (localhost:3000)
# /.well-known/*  → gateway → exchange-agent (A2A agent card)
# /a2a/*          → gateway → exchange-agent (A2A tasks)
# /mcp            → gateway → exchange-agent (MCP JSON-RPC)
# /health         → gateway
# everything else → Next.js portal (localhost:3100)

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Increase body size for payload uploads
    client_max_body_size 10m;

    upstream gateway {
        server 127.0.0.1:3000;
    }

    upstream portal {
        server 127.0.0.1:3100;
    }

    server {
        listen 8080;
        server_name _;

        # Gateway: API routes + health
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://gateway/health;
        }

        # A2A agent card, tasks, and MCP — via gateway → exchange-agent
        location /.well-known/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /a2a/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /mcp {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Next.js portal — everything else
        location / {
            proxy_pass         http://portal;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
